<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>dyver</title>
<style>
  :root { --bg:#f4f1ea; --card:#fffdf8; --ink:#1d1b18; --muted:#6f6a61; --accent:#b4532a; --line:#ddd6c8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16151a; --card:#201f26; --ink:#ece9e2; --muted:#9a958c; --accent:#e07a4b; --line:#34323b; }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family: Georgia, "Times New Roman", serif;
         display:flex; align-items:center; justify-content:center; padding:16px; }
  main { width:100%; max-width:360px; text-align:center; }
  h1 { font-size:3.2rem; letter-spacing:.04em; margin:0 0 .2rem; font-weight:normal; }
  p.sub { color:var(--muted); margin:0 0 2rem; font-style:italic; }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; }
  label { display:block; font-size:.9rem; color:var(--muted); margin-bottom:.6rem; font-family:system-ui, sans-serif; }
  input { width:100%; font-size:1.2rem; padding:.7rem .9rem; border-radius:10px; border:1px solid var(--line);
          background:var(--bg); color:var(--ink); text-align:center; outline:none; }
  input:focus { border-color:var(--accent); }
  button { margin-top:12px; width:100%; font-size:1.05rem; padding:.7rem; border:0; border-radius:10px;
           background:var(--accent); color:#fff; cursor:pointer; font-family:system-ui, sans-serif; }
  .err { min-height:1.4em; margin-top:10px; color:var(--accent); font-family:system-ui, sans-serif; font-size:.9rem; }
  form.shake { animation: shake .35s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
</style>
</head>
<body>
<main>
  <h1>dyver</h1>
  <p class="sub">Bitte eintreten.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autofocus autocapitalize="off" spellcheck="false">
    <button type="submit">Weiter</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<script>
// Passwort -> Ziel. Gespeichert sind nur SHA-256-Werte von "dyver:<passwort>".
// Neues Passwort: Hash mit  printf "dyver:NEU" | sha256sum  erzeugen und hier eintragen.
const ZIELE = {
  "71cabd2498656d9639ea85dd2e376b46abdae417f82338e6687c71df85c5d5f4": "https://storys.dyver.de/",
  "8ec0168de5ab806f4b901b83e24a9a5e0a78c518a4fb4b1ec085df8e70639fa6": "//news.dyver.de/tim/",
  "ed0000c0a5ba84284a8d733a277831c688267568918694704e97aff4cc193631": "//news.dyver.de/mama/",
  "e06b8095460b2456e85660d78032695add8528430bc14b941b07b5658cff481a": "//news.dyver.de/wow/"
};
// SHA-256: per Browser-Krypto, auf http (ohne Krypto) mit kleiner Eigenimplementierung.
async function sha256(text) {
  const bytes = new TextEncoder().encode(text);
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", bytes);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  const K = [], H = [];
  const frac = x => ((x - Math.floor(x)) * 4294967296) | 0;
  for (let n = 2, c = 0; c < 64; n++) {
    let p = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { p = false; break; }
    if (p) { if (c < 8) H[c] = frac(Math.sqrt(n)); K[c++] = frac(Math.cbrt(n)); }
  }
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6, m = new Uint8Array(total);
  m.set(bytes); m[len] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(total - 4, len * 8); dv.setUint32(total - 8, Math.floor(len / 536870912));
  const r = (x, s) => (x >>> s) | (x << (32 - s)), W = new Array(64);
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = r(W[i-15], 7) ^ r(W[i-15], 18) ^ (W[i-15] >>> 3), s1 = r(W[i-2], 17) ^ r(W[i-2], 19) ^ (W[i-2] >>> 10);
      W[i] = (W[i-16] + s0 + W[i-7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
}
const f = document.getElementById("f"), pw = document.getElementById("pw"), err = document.getElementById("err");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const ziel = ZIELE[await sha256("dyver:" + pw.value.trim().toLowerCase())];
  if (ziel) { location.href = ziel; return; }
  err.textContent = "Das Passwort kenne ich nicht.";
  f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
  pw.select();
});
</script>
</body>
</html>
